    <!-- GIFT CARDS -->
    <section class="section section-tint" id="gift-cards" aria-labelledby="gift-title">
      <div class="container gift-grid">
        <div class="gift-art reveal" aria-hidden="true">
          <div class="gift-card">
            <svg width="44" height="44" focusable="false"><use href="#logo-mark"/></svg>
            <span class="gift-brand">{{{brand.wordmark}}}</span>
            <span class="gift-amount" id="gift-amount">${{giftCards.default}}</span>
          </div>
        </div>
        <div class="reveal">
          <p class="eyebrow">Gift cards</p>
          <h2 id="gift-title" data-split>Give the gift of <em>a fresh cut.</em></h2>
          <p class="lead">Emailed instantly, valid for three years and redeemable on any service, package or product in the shop.</p>
          <form id="gift-form" class="gift-form" novalidate>
            <fieldset>
              <legend>Choose an amount</legend>
              <div class="chips">
                {{#each giftAmounts}}<label class="chip-opt"><input type="radio" name="amount" value="{{this.amount}}"{{#if this.checked}} checked{{/if}}><span>${{this.amount}}</span></label>{{/each}}
              </div>
            </fieldset>
            <button class="btn btn-primary" type="submit">Buy a gift card</button>
            <!-- DEMO ONLY: connect a payment provider (e.g. Stripe Checkout or Square) here. -->
          </form>
        </div>
      </div>
    </section>
