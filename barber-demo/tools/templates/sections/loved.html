{{#if hasReviewLink}}
    <!-- LOVED YOUR VISIT -->
    <section class="section section-tint" id="loved" aria-labelledby="loved-title">
      <div class="container narrow loved">
        <h2 id="loved-title" class="reveal">Loved your visit? <em>Tell us.</em></h2>
        <p class="lead reveal">A quick Google review helps other people find a good barber. It takes about a minute.</p>
        <p class="loved-actions reveal"><a class="btn btn-primary" href="{{googleReviewUrl}}" target="_blank" rel="noopener">Leave us a Google review<span class="sr-only"> (opens in a new tab)</span></a> <a class="btn btn-secondary" href="reviews.html">Scan a QR code instead</a></p>
      </div>
    </section>
{{/if}}
