    <!-- MEMBERSHIP -->
    <section class="section" id="plans" aria-labelledby="plans-title">
      <div class="container">
        <div class="section-head reveal">
          <p class="eyebrow">Monthly plans</p>
          <h2 id="plans-title" data-split>Pick a plan, <em>skip the queue.</em></h2>
          <p class="note">Plans and prices are fictional. Cancel or pause any time.</p>
        </div>
        <ul class="exp-grid">
          {{#each memberships}}<li class="exp-card{{#if this.featured}} exp-featured{{/if}} reveal">
            <p class="eyebrow">{{this.name}}{{#if this.tag}} &middot; {{this.tag}}{{/if}}</p>
            <p class="big-num">${{this.price}}<span class="per">/mo</span></p>
            <h3>{{this.headline}}</h3>
            <p>{{this.text}}</p>
            <a class="exp-link" href="book.html">{{this.cta}} &rarr;</a>
          </li>
          {{/each}}
        </ul>
      </div>
    </section>
