    <h1 class="reveal">Get a free concept for your website.</h1>
    <ul class="ticks reveal d1">
      <li>We design your new homepage for free.</li>
      <li>No deposit and no obligation.</li>
      <li>We reply within 24 hours.</li>
    </ul>
    <div class="tile reveal d2">
      <form class="form" id="form-free-concept" data-form="free-concept" action="https://api.web3forms.com/submit" method="POST" data-thanks="thank-you.html" novalidate>
        <input type="hidden" name="access_key" value="bb65a269-46ad-477f-8a41-c2262b203c2f">
        <input type="hidden" name="subject" value="Black Crest: free concept request">
        <input type="hidden" name="from_name" value="Black Crest Website">
        <input type="hidden" name="form" value="free-concept">
        <input type="hidden" name="redirect" value="https://kirithikbala21-jpg.github.io/3D-demo-sites/black-crest-site/thank-you.html">
        <div class="hp" aria-hidden="true"><label>Leave this box empty <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off"></label></div>
        <div class="field">
          <label for="business">Business name</label>
          
          <input id="business" name="business" type="text" required aria-describedby="e-business" autocomplete="organization" data-empty="Please tell us your business name.">
          <p class="field-error" id="e-business" hidden></p>
        </div>
        <div class="field">
          <label for="trade">What you do</label>
          
          <input id="trade" name="trade" type="text" required aria-describedby="e-trade" placeholder="For example: barbershop in Brunswick" data-empty="Please tell us what your business does.">
          <p class="field-error" id="e-trade" hidden></p>
        </div>
        <div class="field">
          <label for="contact">Email or phone</label>
          
          <input id="contact" name="contact" type="text" required aria-describedby="e-contact" autocomplete="email" data-contact="1" data-empty="Please add an email address or phone number so we can reply.">
          <p class="field-error" id="e-contact" hidden></p>
        </div>
        <p class="privacy-line">We only use your details to reply to you. See our <a href="privacy.html">privacy policy</a>.</p>
        <button class="btn btn-gold" type="submit">Get my free concept</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
