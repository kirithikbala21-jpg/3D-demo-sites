    <!-- GALLERY -->
    <section class="section section-tint" id="gallery" aria-labelledby="gallery-title">
      <div class="container">
        <div class="section-head reveal">
          <p class="eyebrow">Gallery</p>
          <h2 id="gallery-title" data-split>A peek <em>inside the room.</em></h2>
          <p class="lead">Illustrated placeholders. A real site would show your own photography here.</p>
        </div>
        <ul class="gallery reveal">
          <li class="tile t1 wide">
            <svg viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">

                <path d="M100 112c-18 2-28 10-28 17 0 5 7 7 28 7s28-2 28-7c0-7-10-15-28-17z"/>

            </svg>
            <span class="tile-cap">Rosetta pour</span>
          </li>
          <li class="tile t2">

              <rect width="200" height="250" fill="url(#beans)"/>
            </svg>
            <span class="tile-cap">Weekly roast</span>
          </li>
          <li class="tile t3">
            <svg viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">

            </svg>
            <span class="tile-cap">Evening glow</span>
          </li>
          <li class="tile t8 wide">
            <svg viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
              <defs>
                <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
