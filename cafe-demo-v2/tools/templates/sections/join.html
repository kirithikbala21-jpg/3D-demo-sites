    <!-- NEWSLETTER -->
    <section class="section section-wine" id="join" aria-labelledby="join-title">
      <div class="container join-inner">
        <p class="eyebrow">The Ember letter</p>
        <h2 id="join-title" data-split>Join the <em>slow mornings</em> list.</h2>
        <p class="lead">Seasonal menus, new coffee releases and invites to tastings, once a month. No spam, ever.</p>
        <form id="news-form" novalidate>
          <label class="sr-only" for="n-email">Email address</label>
          <div class="news-row">
            <input id="n-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" aria-describedby="e-news p-news">
            <button class="btn btn-primary" type="submit">Join</button>
          </div>
          <p class="error" id="e-news" aria-live="polite"></p>
          <p class="form-note" id="p-news">We only use your email for the letter. Unsubscribe any time.</p>
          <!-- DEMO ONLY: connect Mailchimp, Beehiiv or similar here. -->
        </form>
      </div>
    </section>
