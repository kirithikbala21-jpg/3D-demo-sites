<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page not found: KB Ventures</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D0E12">
<script>
  // A 404 page can be shown at any address, so point relative links back at the site folder:
  // .../kbventures-site/ while the site lives in the 3D-demo-sites repo, or / once it has its own repo.
  (function () {
    var m = location.pathname.match(/^(.*\/kbventures-site\/)/);
    document.write('<base href="' + (m ? m[1] : '/') + '">');
  })();
</script>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="nav is-scrolled">
  <div class="nav-inner">
    <a class="wordmark" href="./">KB Ventures</a>
    <nav class="nav-links" aria-label="Main">
      <a href="./#businesses">Businesses</a>
      <a href="./#websites">Websites</a>
      <a href="./#contact">Contact</a>
    </nav>
    <a class="pill pill-primary pill-sm" href="./#contact">Get in touch</a>
  </div>
</header>
<main class="missing">
  <div class="wrap center">
    <p class="label">Error 404</p>
    <h1 class="h2">This page isn&rsquo;t here.</h1>
    <p class="lead">The address may have a typo, or the page has moved. Everything we have is on the home page.</p>
    <a class="pill pill-primary" href="./">Go to the home page</a>
  </div>
</main>
</body>
</html>
