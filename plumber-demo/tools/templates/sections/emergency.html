    <section class="emergency" id="emergency" aria-labelledby="emergency-title">
      <div class="em-bg" aria-hidden="false">{{{photos.emergency-bg}}}</div>
      <div class="container em-inner">
        <p class="eyebrow eyebrow-dark">Emergency line, 24/7</p>
        <h2 id="emergency-title" data-pipe>Burst pipe? Gas smell? Call now.</h2>
        <a class="em-number" href="tel:{{contact.phoneHref}}" aria-label="Call {{contact.phone}}">{{contact.phone}}</a>
        <ul class="em-points">
          <li><svg width="24" height="24" aria-hidden="true" focusable="false"><use href="#i-check"/></svg>A real person answers</li>
          <li><svg width="24" height="24" aria-hidden="true" focusable="false"><use href="#i-check"/></svg>Call-out fee quoted before we leave the depot</li>
          <li><svg width="24" height="24" aria-hidden="true" focusable="false"><use href="#i-check"/></svg>We clean up after ourselves</li>
        </ul>
      </div>
    </section>
