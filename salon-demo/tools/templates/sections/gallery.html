    <section class="section" id="gallery" aria-labelledby="gallery-title">
      <div class="container">
        <div class="reveal sec-head">
          <p class="eyebrow">Our work</p>
          <h2 id="gallery-title">A few recent looks</h2>
          <p class="lead">Tap a photo to see it larger.</p>
        </div>
        <ul class="masonry" role="list" id="gallery-list">
          {{#each galleryItems}}{{{this.html}}}
          {{/each}}
        </ul>
      </div>
    </section>
