    <section class="hero{{#if heroReal}} hero-real{{/if}}" id="hero" aria-labelledby="hero-title" data-parallax="26">
      <div class="hero-media">{{{photos.hero}}}</div>
      <div class="hero-scrim" aria-hidden="true"></div>
      <div class="container hero-inner">
        <p class="eyebrow hero-eyebrow">Hair and beauty, {{contact.suburb}}</p>
        <h1 id="hero-title">Hair that feels <em>like you.</em></h1>
        <p class="hero-sub">Cuts, colour and care from four stylists who listen first. Clear prices, and a chair you can book from your phone.</p>
        <p class="hero-actions"><a class="btn btn-light btn-lg" href="#book" data-book-link>Book now</a> <a class="btn btn-outline-light btn-lg" href="#services">See prices</a></p>
        {{#if ratingHero}}<p class="hero-rating">{{{ratingHero}}}</p>{{/if}}
        <p class="hero-open" data-open-today><span class="dot" aria-hidden="true"></span><span data-open-text>{{{hoursInline}}}</span></p>
      </div>
    </section>
