    {{#if reviewsOn}}<section class="section section-sand loved" id="loved" aria-labelledby="loved-title">
      <div class="container narrow-ish">
        <div class="reveal sec-head">
          <p class="eyebrow">Leave a review</p>
          <h2 id="loved-title">Loved your visit? Tell us</h2>
          <p class="lead">A quick Google review helps other people find us. It takes about a minute.</p>
        </div>
        <p class="loved-actions reveal"><a class="btn btn-primary btn-lg" href="{{googleReviewUrl}}" target="_blank" rel="noopener">Leave us a Google review<span class="sr-only"> (opens in a new tab)</span></a> <a class="btn btn-ghost btn-lg" href="reviews.html">Show the QR code</a></p>
        <p class="small reveal">Demo link: it does not go to a real review page.</p>
      </div>
    </section>{{/if}}
