    <section class="section section-sand" id="why" aria-labelledby="why-title">
      <div class="container why-grid">
        <div class="why-text">
          <div class="reveal sec-head">
            <p class="eyebrow">Why choose us</p>
            <h2 id="why-title">Unhurried, careful, honest</h2>
          </div>
          <ul class="why-list" role="list">
            {{#each why}}
            <li class="why-item reveal"><h3>{{this.title}}</h3><p>{{this.text}}</p></li>
            {{/each}}
          </ul>
        </div>
        <div class="why-photos reveal">
          <div class="why-p1 zoom" data-parallax="8">{{{photos.interior-1}}}</div>
          <div class="why-p2 zoom" data-parallax="8">{{{photos.products-1}}}</div>
        </div>
      </div>
    </section>
